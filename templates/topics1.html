<!DOCTYPE html>
<html>
<head>
  <title>{{ subject.name }} — Topics</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      color: #175e7a;
      margin-bottom: 4px;
    }
    .breadcrumb {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .topic {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .topic.locked {
      background: #f8f8f8;
      color: #999;
    }
    .topic a {
      color: inherit;
      text-decoration: none;
      font-size: 16px;
      flex: 1;
    }
    .topic-icon {
      font-size: 20px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin-left: 8px;
      text-transform: uppercase;
    }
    .badge-free {
      background: #d4edda;
      color: #155724;
    }
    .badge-paid {
      background: #fff3cd;
      color: #856404;
    }
    .back-link {
      display: inline-block;
      margin-top: 30px;
      color: #175e7a;
    }
  </style>
</head>
<body>
  <h1>{{ subject.name }}</h1>
  <p class="breadcrumb">Goal: {{ subject.goal_name }}</p>

  {% if not topics %}
    <p>No topics available yet.</p>
  {% endif %}

  {% for topic in topics %}
    <div class="topic {% if topic.locked %}locked{% endif %}">
      <a href="/topics/{{ topic.id }}/start">
        {{ topic.name }}
        <span class="badge badge-{{ topic.access_level }}">
          {{ topic.access_level }}
        </span>
      </a>

      <span class="topic-icon">
        {% if topic.locked %}
          🔒
        {% elif topic.status == 'completed' %}
          ✅
        {% else %}
          ▶️
        {% endif %}
      </span>
    </div>
  {% endfor %}

  <a class="back-link" href="/home">← Back to home</a>
</body>
</html>
