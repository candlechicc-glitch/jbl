<!DOCTYPE html>
<html>
<head>
  <title>Login with Email</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 400px; margin: auto; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
    .error { color: red; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Login with Email</h1>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="loginWithEmail()">Login</button>
  <div id="email-error" class="error"></div>

  <p style="margin-top:20px;"><a href="/login">Back</a></p>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/signin.js"></script>
</body>
</html>
