<!DOCTYPE html>
<html>
<head>
  <title>{{ topic.name }} — Review</title>
</head>
<body>
  <h1>{{ topic.name }}</h1>
  <p>Goal: {{ topic.goal_name }}</p>

  <hr>

  <h2>Your Results</h2>
  <p>Total questions: <strong>{{ total_questions }}</strong></p>
  <p>Correct: <strong style="color:green;">{{ correct_count }}</strong></p>
  <p>Wrong: <strong style="color:red;">{{ wrong_count }}</strong></p>

  <hr>

  <p>
    <a href="/topics/{{ topic.id }}/review/questions">
      <button>Review Questions</button>
    </a>
  </p>

  <p><a href="/subjects/{{ topic.subject_id }}/topics">← Back to topics</a></p>
</body>
</html>
