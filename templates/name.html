<!DOCTYPE html>
<html>
<head>
  <title>Tell Us Your Name</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 400px; margin: auto; }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #175e7a;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 12px;
    }
    .error { color: red; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>What should we call you?</h1>
  <p>This helps us personalize your experience.</p>

  <input id="first_name" type="text" placeholder="First name">
  <input id="last_name" type="text" placeholder="Last name (optional)">
  <button onclick="saveName()">Continue</button>
  <div id="name-error" class="error"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/setup_name.js"></script>
</body>
</html>
