<!DOCTYPE html>
<html>
<head>
  <title>{{ subject.name }} — QBank Bookmarks</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 1100px; margin: auto; }
    h1 { color: #175e7a; margin-bottom: 4px; }
    .back { display: inline-block; margin-bottom: 16px; color: #175e7a; text-decoration: none; font-size: 14px; }
    .back:hover { text-decoration: underline; }
    .breadcrumb { color: #888; font-size: 14px; margin-bottom: 20px; }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* Left: question list */
    .qlist {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      max-height: 75vh;
      overflow-y: auto;
      background: #fafbfc;
    }
    .qlist-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: none;
      border-bottom: 1px solid #e2e8f0;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #1a202c;
    }
    .qlist-item:last-child { border-bottom: none; }
    .qlist-item:hover { background: #eef7fa; }
    .qlist-item.active { background: #5ab4c5; color: white; }
    .qlist-item .cat {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e0f2f5;
      color: #175e7a;
      margin-right: 6px;
    }
    .qlist-item.active .cat {
      background: rgba(255,255,255,0.3);
      color: white;
    }

    /* Right: detail panel */
    .detail {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 24px;
      background: white;
    }
    .detail-empty { color: #888; text-align: center; padding: 40px 0; }
    .detail-meta { color: #888; font-size: 13px; margin-bottom: 16px; }
    .detail-qtext { font-size: 17px; margin-bottom: 16px; white-space: pre-wrap; color: #1a202c; }
    .detail-image { max-width: 100%; border-radius: 8px; margin: 8px 0; }
    .detail-answer {
      background: #f6fbff;
      border-left: 3px solid #5ab4c5;
      padding: 14px 16px;
      margin-top: 16px;
      white-space: pre-wrap;
      color: #2c5b66;
    }
    .detail-answer strong { color: #175e7a; }

    .detail-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      gap: 8px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #5ab4c5;
      background: white;
      color: #175e7a;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #f0f7fb; }
    .btn-primary { background: #5ab4c5; color: white; }
    .btn-primary:hover { background: #4aa0b0; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .remove-btn {
      background: #fff0f0;
      border-color: #e5a0a0;
      color: #b03030;
    }
    .remove-btn:hover { background: #ffe0e0; }
  </style>
</head>
<body>

  <a class="back" href="/qbank/bookmarks">← Back to QBank bookmarks</a>

  <h1>{{ subject.name }}</h1>
  <p class="breadcrumb">{{ questions|length }} bookmarked question{% if questions|length != 1 %}s{% endif %}</p>

  {% if not questions %}
    <p class="empty">No bookmarks in this subject yet.</p>
  {% else %}

  <div class="layout">

    <!-- LEFT: list of bookmarked questions -->
    <div class="qlist" id="qlist">
      {% for q in questions %}
        <button class="qlist-item" type="button" data-index="{{ loop.index0 }}">
          <span class="cat">{{ q.category_label }}</span>
          {{ q.text[:80] }}{% if q.text|length > 80 %}…{% endif %}
        </button>
      {% endfor %}
    </div>

    <!-- RIGHT: detail panel -->
    <div class="detail" id="detail">
      <div class="detail-empty">Select a question on the left.</div>
    </div>

  </div>

  <!-- Data for the JS -->
  <script>
    window.QUESTIONS = {{ questions | tojson }};
  </script>

<script src="{{ url_for('static', filename='js/qbank_bookmark_subject.js') }}"></script>
  {% endif %}

</body>
</html>
