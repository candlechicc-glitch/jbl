<!DOCTYPE html>
<html>
<head>
  <title>{{ attempt.test_name }}</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; display: flex; }
    .main { flex: 1; padding-right: 20px; }
    .sidebar {
      width: 260px;
      border-left: 1px solid #ddd;
      padding-left: 20px;
      overflow-y: auto;
      max-height: 100vh;
    }
    .palette button { border: 1px solid #ccc; }
    #timer { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="main">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>{{ attempt.test_name }}</h1>
      <div>⏱ <span id="timer">--:--</span></div>
    </div>

    <p>Question <strong id="progress">1</strong> of <strong>{{ questions|length }}</strong></p>

    <div>
      <button onclick="toggleBookmark()" id="bookmark-btn">☆ Bookmark</button>
      <button onclick="toggleMark()" id="mark-btn">☆ Mark for Review</button>
      <button onclick="confirmExit()">Exit</button>
    </div>

    <hr>

    <p id="question-text"></p>
    <img id="question-image" style="display:none; max-width:400px;">

    <div id="options-container"></div>

    <hr>

    <button onclick="goPrev()" id="prev-btn">Previous</button>
    <button onclick="goNext()" id="next-btn">Next</button>
  </div>

  <div class="sidebar">
    <h3>Questions</h3>
    <div id="palette" class="palette"></div>
    <div style="margin-top:10px;">
      <button onclick="palettePrev()" id="palette-prev">← Prev</button>
      <button onclick="paletteNext()" id="palette-next">Next →</button>
    </div>
  </div>

  <div id="exit-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div style="background:white; padding:20px;">
      <p>Are you sure? Your progress is saved.</p>
      <button onclick="closeExit()">Cancel</button>
      <a href="/tests">Yes, exit</a>
    </div>
  </div>

  <script>
    const ATTEMPT_ID = {{ attempt.id }};
    const QUESTIONS = {{ questions | tojson }};
    const DRAFTS = {{ drafts | tojson }};
    const BOOKMARKED_IDS = {{ bookmarked_ids | tojson }};
    const START_INDEX = {{ start_index }};
    const REMAINING_SECONDS = {{ remaining_seconds }};
  </script>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/test_question.js"></script>
</body>
</html>
