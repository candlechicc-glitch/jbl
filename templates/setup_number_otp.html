<!DOCTYPE html>
<html>
<head>
  <title>Verify Phone</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 400px; margin: auto; }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #175e7a;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 12px;
    }
    .error { color: red; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Verify your phone</h1>
  <p>We sent a 6-digit code to <strong>{{ phone }}</strong></p>

  <input id="otp" type="text" placeholder="6-digit code" maxlength="6">
  <button onclick="verifyNumberOtp()">Verify</button>
  <div id="otp-error" class="error"></div>

  <p style="margin-top:20px;"><a href="/setup-number">Back</a></p>

  <script>
    const SIGNUP_PHONE = "{{ phone }}";
  </script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/signup.js"></script>
  <script src="/static/js/setup_name.js"></script>

</body>
</html>
